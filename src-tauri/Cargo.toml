[package]
name = "ccload-client"
version = "0.1.0"
description = "Desktop client for the ccLoad multi-channel LLM gateway"
authors = ["ccload-client"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ccload_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
thiserror = "2"
toml_edit = "0.22"
base64 = "0.22"
rand = "0.8"
dirs = "5"
tracing = "0.1"
# 版本比较。自己写一个「按点分段比大小」几乎必错在预发布这一段上：我们发的
# 全是 `0.1.0-beta.20260822.4` 这种，semver 规定带预发布的**小于**同号正式版，
# 而段内数字要按数值比（`beta.20260822.10` > `beta.20260822.9`，字典序会反）。
semver = "1"
# 快照对比用的行级 diff。只要 `text`，不要默认那堆 inline/unicode 分词 ——
# 我们比的是配置文件（JSON/TOML/Markdown），按行看就够，字符级高亮只会让
# 几百 KB 的 ~/.claude.json 慢下来。
similar = { version = "3.2.0", default-features = false, features = ["text"] }

# macOS 的自动大写/智能标点是系统级文本替换，HTML 的 autocapitalize 在桌面端
# 只是软键盘提示，管不到它。要关只能在启动时改本应用的 NSUserDefaults。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
