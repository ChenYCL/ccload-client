name: Kernel Sync

# 上游内核发了新版，就把 KERNEL_VERSION 跟上去，并按**上游那一版的性质**决定
# 我们出什么包：
#
#   上游 prerelease（beta）  →  我们出 beta 包（beta.yml，prerelease）
#   上游正式版              →  客户端 patch +1，推 tag，出**草稿** release
#
# 为什么值得自动化：壳体和内核是分开的两个仓库，内核几乎每天出 beta，而绝大多数
# 内核改动**不需要壳体改一行代码**（协议转换、渠道、故障转移全在内核里）。人工
# 跟版的结果就是忘记跟，于是发出去的包带着几周前的内核，用户在客户端里看到的
# 「打包内核」和自己远端跑的对不上。
#
# 但「自动跟」不等于「闭眼跟」，两道闸都在：
#   1. 提交之前**先把内核编一遍**。内核偶尔会引入新的构建前置（v4.7.3 那次加的
#      third_party/cursor-sdk-bridge 就是），编不出来就该红在这条流水线上，而不是
#      把一个编不出来的钉子推上 main。
#   2. 正式版出的是**草稿** release。包体上百 MB，发出去之前值得人眼看一下产物
#      齐不齐 —— 点 Publish 的永远是人。
#
# 只有一个 KERNEL_VERSION，不会左右横跳：它只往「上游最新的那一版」走，不管那版
# 是 beta 还是正式版。分叉的只是出包这一步。

on:
  schedule:
    # 每小时的第 17 分钟。避开整点 —— GitHub 的 cron 在整点排队最长，
    # 而这条任务不急，晚十几分钟没有任何代价。
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '要钉的内核 tag（留空 = 上游最新的一个 release，含 prerelease）'
        required: false
        default: ''
      dry_run:
        description: '只看会跟到哪一版、编得过编不过，不提交也不出包'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # 用来 `gh workflow run`。GITHUB_TOKEN 推的 commit **和 tag** 都不会触发其它
  # workflow（GitHub 防死循环的硬规则），所以两条线的出包都必须显式派发 ——
  # 指望 push tag 自动带出 release.yml 是空等。
  actions: write

concurrency:
  # 不要 cancel-in-progress：这条 job 会推 commit 和 tag，跑到一半被掐掉可能留下
  # 「版本号改了但 tag 没推」的中间状态。宁可排队。
  group: kernel-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Follow upstream kernel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Resolve upstream release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CURRENT=$(tr -d '[:space:]' < KERNEL_VERSION)
          if [ -n "$FORCED" ]; then
            # 手动指定时也要问一次上游，否则「这版是不是 prerelease」只能靠猜
            # tag 里有没有 `-beta`，而上游随时可能换个后缀。
            LATEST="$FORCED"
            PRE=$(gh api "repos/caidaoli/ccLoad/releases/tags/$LATEST" -q '.prerelease')
          else
            # 用 /releases 而不是 /releases/latest：内核发的是 beta，而
            # /releases/latest 按定义**跳过 prerelease**，用它会永远停在上一个
            # 正式版上，看着像「已经是最新」（实测停在 v4.7.0，落后三个 beta）。
            # 列表接口按创建时间倒序，第一条就是最新的那个。
            read -r LATEST PRE < <(
              gh api 'repos/caidaoli/ccLoad/releases?per_page=1' \
                -q '.[0] | "\(.tag_name) \(.prerelease)"'
            )
          fi
          [ -n "$LATEST" ] && [ "$LATEST" != "null" ] || { echo "::error::拿不到上游 tag"; exit 1; }
          [ "$PRE" = "true" ] || [ "$PRE" = "false" ] || { echo "::error::prerelease 标志读不出来：$PRE"; exit 1; }
          {
            echo "current=$CURRENT"
            echo "latest=$LATEST"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已经是 $CURRENT，无事可做。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ "$PRE" = "true" ]; then
              echo "::notice::内核 $CURRENT → $LATEST（beta 线）"
            else
              echo "::notice::内核 $CURRENT → $LATEST（正式版线）"
            fi
          fi

      - name: Pin and build the new kernel
        if: steps.up.outputs.changed == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.up.outputs.latest }}' > KERNEL_VERSION
          npm ci
          npm run kernel:fetch
          # 真正的门：编不出来就别提交。这一步是唯一能在推 main 之前发现「上游加了
          # 新构建前置」的地方。顺带重新生成 kernel-version.txt（壳体 include_str!
          # 它，用来在不启动内核时显示打包版本）。
          npm run kernel:build
          npm run typecheck

      # 正式版才动客户端版本号。beta 线一个字都不碰它 —— beta 包的版本号由
      # beta.yml 自己按 `package.json + 日期 + 当天第 N 次` 现算，不回写仓库。
      - name: Bump client version
        id: bump
        if: steps.up.outputs.changed == 'true' && steps.up.outputs.prerelease == 'false'
        run: |
          set -euo pipefail
          NEXT=$(node -e '
            const fs = require("fs");

            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
            if (!m) throw new Error(`package.json 的版本号不是 x.y.z：${pkg.version}`);
            const next = `${m[1]}.${m[2]}.${Number(m[3]) + 1}`;

            // 三处版本号必须一致，release.yml 的「Verify tag matches app version」
            // 会拿 tag 去比前两处，对不上直接红。
            for (const p of [pkgPath, "src-tauri/tauri.conf.json"]) {
              const doc = JSON.parse(fs.readFileSync(p, "utf8"));
              doc.version = next;
              fs.writeFileSync(p, JSON.stringify(doc, null, 2) + "\n");
            }

            // Cargo.toml：只换 [package] 里的第一个 version，别碰依赖的版本。
            const toml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
            let done = false;
            fs.writeFileSync("src-tauri/Cargo.toml", toml.replace(
              /^version = "[^"]+"$/m,
              (hit) => { if (done) return hit; done = true; return `version = "${next}"`; },
            ));
            if (!done) throw new Error("Cargo.toml 里没找到 version 行");

            // Cargo.lock 里 ccload-client 自己那一条。正常是 `cargo check` 顺手
            // 更新的，但这条 job 没装 Rust 工具链 —— 为了一个版本号去装 Rust 加
            // 一整套 webkit 系统依赖不划算。改的是同一个字段，结果一模一样。
            const lockPath = "src-tauri/Cargo.lock";
            const lock = fs.readFileSync(lockPath, "utf8");
            const patched = lock.replace(
              /(name = "ccload-client"\nversion = )"[^"]+"/,
              `$1"${next}"`,
            );
            if (patched === lock) throw new Error("Cargo.lock 里没找到 ccload-client 的版本");
            fs.writeFileSync(lockPath, patched);

            process.stdout.write(next);
          ')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "::notice::客户端版本 → $NEXT"

      - name: Commit and push
        id: commit
        if: steps.up.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          EXPECTED="KERNEL_VERSION src-tauri/kernel-version.txt"
          if [ '${{ steps.up.outputs.prerelease }}' = 'false' ]; then
            EXPECTED="$EXPECTED package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock"
          fi
          # shellcheck disable=SC2086
          git add $EXPECTED

          # 暂存区里只该有上面这些。这条 job 有 contents:write，多推一个文件上去
          # 没人会审 —— 与其带着未知改动推上 main，不如红在这里。
          WANT=$(printf '%s\n' $EXPECTED | sort | tr '\n' ' ')
          GOT=$(git diff --cached --name-only | sort | tr '\n' ' ')
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::暂存区和预期对不上"
            echo "  预期: $WANT"
            echo "  实际: $GOT"
            exit 1
          fi

          # 提交信息走 heredoc 而不是 `-m "多行"`：多行字符串直接写在 YAML 的
          # 块标量里，续行顶到第 0 列就把块标量本身截断了，整个 workflow 解析失败。
          cat > /tmp/msg.txt <<EOF
          chore(kernel): 内核钉到 ${{ steps.up.outputs.latest }}

          上游从 ${{ steps.up.outputs.current }} 发到了 ${{ steps.up.outputs.latest }}，由 kernel-sync 自动跟随。
          内核已在本次 CI 上完整编过一遍（universal 的合成在打包那条流水线上做），
          typecheck 也过了。

          壳体代码没有改动。内核那边具体改了什么见
          https://github.com/caidaoli/ccLoad/releases/tag/${{ steps.up.outputs.latest }}
          EOF
          if [ '${{ steps.up.outputs.prerelease }}' = 'false' ]; then
            cat >> /tmp/msg.txt <<EOF

          上游这一版是正式版，所以客户端版本一并 patch +1 到 ${{ steps.bump.outputs.next }}，
          并推 tag v${{ steps.bump.outputs.next }} 出一个**草稿** release —— 点 Publish 的是人。
          EOF
          fi
          sed -i 's/^          //' /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push origin HEAD:main

          if [ '${{ steps.up.outputs.prerelease }}' = 'false' ]; then
            TAG="v${{ steps.bump.outputs.next }}"
            git tag "$TAG"
            git push origin "$TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      # ---- beta 线 ----------------------------------------------------------
      - name: Dispatch beta build
        if: steps.up.outputs.changed == 'true' && inputs.dry_run != true && steps.up.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run beta.yml -f ref=main
          echo "::notice::已派发 beta 打包（内核 ${{ steps.up.outputs.latest }}）"

      # ---- 正式版线 ---------------------------------------------------------
      - name: Dispatch release build
        if: steps.up.outputs.changed == 'true' && inputs.dry_run != true && steps.up.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--ref <tag>` 是必须的，不是可选的美化：release.yml 的 publish job
          # 条件是 `startsWith(github.ref, 'refs/tags/v')`，从分支派发会照常编三
          # 平台却**不发布任何东西**，白跑 30 分钟。
          gh workflow run release.yml --ref '${{ steps.commit.outputs.tag }}'
          echo "::notice::已派发正式版打包（${{ steps.commit.outputs.tag }}，内核 ${{ steps.up.outputs.latest }}）→ 草稿 release"

      - name: Summary
        if: always()
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| 仓库当前钉的 | \`${{ steps.up.outputs.current }}\` |"
            echo "| 上游最新 | \`${{ steps.up.outputs.latest }}\` |"
            echo "| 上游是 prerelease | ${{ steps.up.outputs.prerelease }} |"
            echo "| 是否跟随 | ${{ steps.up.outputs.changed }} |"
            echo "| 走哪条线 | ${{ steps.up.outputs.prerelease == 'true' && 'beta（prerelease 包）' || '正式版（草稿 release，需人工 Publish）' }} |"
            echo "| 客户端新版本 | \`${{ steps.bump.outputs.next || '不变' }}\` |"
            echo "| dry run | ${{ inputs.dry_run || false }} |"
          } >> "$GITHUB_STEP_SUMMARY"
