name: Beta Release

# beta 包：三平台安装包 + prerelease。正式版由人推 v* tag（release.yml），
# 两条线互不干扰。
#
# 目前是**手动触发**：Actions → Beta Release → Run workflow，填分支即可。
# 等 ci.yml 在真实 CI 上跑绿、确认这条流水线本身没问题之后，把下面注释掉的
# `push: branches: [main]` 放开，就变成「合进 main 自动出 beta」。
#
# 为什么不绑 PR：三平台全量打包一次 25–40 分钟，每个 PR 跑一次既烧配额也没人
# 下载。PR 的质量门在 ci.yml（typecheck / clippy / test）。
#
# 版本号 = package.json 的 version + 当天日期 + 该日第 N 次（v0.1.0-beta.20260819.1）。
# beta 包只发 prerelease，永远不会被「latest」指到。

on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: '要打包的分支 / commit（默认 main）'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    name: Compute beta tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 时按输入的 ref 检出
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - id: ver
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./package.json').version")
          TODAY=$(date -u +%Y%m%d)
          # 当天已有的 beta 数 = 同前缀的 tag 个数，下一个就是 +1。有并发达 main
          # 的极端情况可能撞号，撞了 release 会失败，重跑一次即可。
          N=$(( $(git tag -l "v${BASE}-beta.${TODAY}.*" | wc -l | tr -d ' ') + 1 ))
          echo "tag=v${BASE}-beta.${TODAY}.${N}" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    runs-on: ${{ matrix.os }}
    # secrets 不能直接出现在 step 的 if 里，先在 job 级别落成 env。
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 必须出 universal：壳体和内核架构不一致时，Apple Silicon 上被
          # Rosetta 翻译的 WebKit 会 SIGBUS（表现为白屏/闪退）。
          - os: macos-14
            label: macos-universal
            plat: mac
            tauri_args: --target universal-apple-darwin
          - os: ubuntu-22.04
            label: linux-x86_64
            plat: linux
            tauri_args: --bundles appimage,deb
          # beta 的 Windows 只出 NSIS，不出 MSI。MSI 的 ProductVersion 要求
          # 预发布标识「纯数字且 ≤65535」，`beta.20260819.1` 直接被拒：
          #   optional pre-release identifier in app version must be
          #   numeric-only and cannot be greater than 65535 for msi target
          # 硬塞一个纯数字序号也不划算 —— MSI 比较版本时忽略第四段，两个 beta
          # 会被当成同一版本，覆盖安装报 1638。NSIS 用的是
          # nsis_tauri_utils::SemverCompare，认完整 semver，升级顺序天然正确。
          # MSI 由 release.yml 覆盖：正式 tag 是干净的 v0.1.0，本来就合法。
          - os: windows-2022
            label: windows-x86_64
            plat: win
            tauri_args: --bundles nsis
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 内核是 Go 写的，要现编进包里。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev patchelf file wget \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      # 用 npm ci：仓库里只有 package-lock.json，多引入一份 pnpm 锁文件就是
      # 两份真相，迟早对不上。本地用 pnpm 不受影响。
      - run: npm ci

      # 把上游内核拉到 KERNEL_VERSION 钉住的 tag。源码不进本仓库（硬约束是
      # 不改它），但版本要可复现。
      - name: Fetch pinned ccLoad kernel
        run: npm run kernel:fetch

      # ---- 代码签名（可选）------------------------------------------------
      # 没配 secret 就出未签名包：一个刚开源的项目不该因为缺 Apple 开发者账号
      # 而整条流水线红掉。配上之后同一份 workflow 自动开始签名 + 公证。
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "::error::找不到 Developer ID Application 证书"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          # 公证凭据同理，只在三个都齐的时候才写。缺一个就整组不写：
          # Tauri 看到空的 APPLE_ID 一样会当成「要公证」，然后拿空账号失败。
          if [ -n "${{ secrets.APPLE_ID }}" ] \
            && [ -n "${{ secrets.APPLE_PASSWORD }}" ] \
            && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            {
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
          fi
          rm -f "$CERT_PATH"

      # beta 版本号打进包体（不回写 git）。侧栏读的是 Vite 注入的 package.json
      # 版本，getVersion() 读的是 tauri.conf.json —— 两处都要戳，否则界面上只
      # 看得到基座 0.1.0，分不清装的是哪一包 beta。
      - name: Stamp beta version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.env.BETA_TAG.slice(1);  // v0.1.0-beta.… → 0.1.0-beta.…
            for (const p of ["package.json", "src-tauri/tauri.conf.json"]) {
              const doc = JSON.parse(fs.readFileSync(p, "utf8"));
              doc.version = ver;
              fs.writeFileSync(p, JSON.stringify(doc, null, 2) + "\n");
            }
          '
        env:
          BETA_TAG: ${{ needs.bump.outputs.tag }}

      - name: Build
        shell: bash
        # 这里**不能**写 `APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}`：
        # 没配证书时它渲染成空字符串，而「变量存在且为空」在 Tauri 眼里就等于
        # 「要签名」，于是拿着空身份去 keychain 里找，报
        # `error: The specified item could not be found in the keychain`，
        # 整条流水线红在最后一步。签名相关的变量一律只由上面那个 step 在真的
        # 导入了证书之后写进 $GITHUB_ENV —— 没配就压根不存在，Tauri 直接跳过。
        run: bash scripts/ci-tauri-build.sh ${{ matrix.tauri_args }}

      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          TAG="${{ needs.bump.outputs.tag }}"
          # 平台放**最前面**：GitHub 的 Assets 列表按宽度截断文件名，原来的
          # `ccLoad-<长版本号>-kernel-<长内核号>-<平台>` 正好在平台那里被截掉，
          # 一列下来五个文件名看着一模一样，分不出哪个是 mac 哪个是 win。
          # 内核版本从文件名里拿掉了 —— release notes 里有，不必挤在这。
          NAME="ccLoad-${{ matrix.plat }}-${TAG}"

          # 各平台的产物散在不同的 bundle 子目录，统一按后缀捞。
          find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -not -path '*/deps/*' -print0 |
          while IFS= read -r -d '' f; do
            ext="${f##*.}"
            cp "$f" "release-assets/${NAME}.${ext}"
            echo "collected: ${NAME}.${ext}"
          done

          # macOS 另外压一份 .app：DMG 之外给不想挂载磁盘映像的人一个选择。
          # bundle_dmg.sh 偶发失败时 zip 就是唯一的 mac 产物，必须打出来。
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP=$(find src-tauri/target -maxdepth 6 -name '*.app' -type d | head -1)
            [ -n "$APP" ] && ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/${NAME}.zip"
            if ! ls release-assets/*.dmg >/dev/null 2>&1; then
              echo "::warning::no .dmg (hdiutil flaked); shipping .app zip only"
            fi
          fi

          ls -lh release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish beta release
    needs: [bump, build]
    runs-on: ubuntu-22.04
    steps:
      # 要算 changelog 就得有完整历史和已有的 tag。ref 必须和 bump/build 检出的
      # 是同一个，否则 notes 里列的提交和包里装的代码对不上。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist-assets

      # notes 里要嵌上游内核的更新日志，那段是个 node 脚本（要 fetch，Node ≥18）。
      # runner 镜像自带的 node 版本会随镜像漂，钉一个免得哪天悄悄编不过。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Flatten + checksums
        run: |
          mkdir -p release-assets
          find dist-assets -type f -exec mv {} release-assets/ \;
          cd release-assets
          sha256sum * > checksums.txt
          ls -lh

      # release notes 里要能看出这一版**做了什么**。原来只有一句「自动构建」+
      # commit 号，等于让人自己去翻 git log —— 那 release 页就只是个下载页。
      - name: Build release notes
        id: notes
        env:
          TAG: ${{ needs.bump.outputs.tag }}
          # 上游内核的更新日志要跨仓库读 caidaoli/ccLoad 的 releases。公开仓库
          # 不带 token 也读得到，但未认证配额是每小时 60 次/IP，而 runner 是共享
          # 出口 —— 带上省得偶发限流让这一段无声消失。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 上一枚 beta tag。本次的 tag 由 action-gh-release 在这一步之后才创建，
          # 所以现存最新的那枚就是上一版。按创建时间排而不是版本号：beta 号带
          # 日期段（…beta.20260821.8），跨天时 refname 排序会给出错的顺序。
          PREV=$(git tag -l 'v*-beta.*' --sort=-creatordate | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            COMPARE="自 \`${PREV}\` 以来"
          else
            # 第一枚 beta：没有上一版可比，退到最近 20 条，别让 notes 空着。
            RANGE="HEAD~20..HEAD"
            COMPARE="最近的改动"
          fi

          # 只取提交标题；合并提交不要（它们没有信息量，只有「Merge branch」）。
          git log --no-merges --pretty=format:'%s' "$RANGE" > /tmp/subjects.txt || true

          KERNEL=$(cat KERNEL_VERSION 2>/dev/null | tr -d '[:space:]' || echo unknown)
          # 上一版包里装的内核。读的是那枚 tag 上的文件，不是 git log —— 内核版本
          # 有可能被手动改过，而「上一版装的到底是哪一个」只有那个文件说了算。
          KERNEL_PREV=""
          if [ -n "$PREV" ]; then
            KERNEL_PREV=$(git show "${PREV}:KERNEL_VERSION" 2>/dev/null | tr -d '[:space:]' || true)
          fi

          # 内核没换时脚本自己输出空串，这一节就整段不存在。
          node scripts/kernel-changelog.mjs --from "$KERNEL_PREV" --to "$KERNEL" \
            > /tmp/kernel-notes.md || true

          {
            echo "### ${COMPARE}"
            echo
            # 按 Angular 类型分组。仓库的提交规范就是这个，分完组一眼能看出
            # 这一版是加功能还是修 bug。
            emit() {
              local pattern="$1" title="$2"
              local lines
              # pattern 里有 `a|b|c` 这种交替，**必须整体括起来**再接后面的
              # `(\(scope\))?:`。不括的话 ERE 的交替优先级最低，`^chore|ci|…`
              # 会被读成「行首 chore」或「任意位置 ci」—— `ci(release): x` 就只
              # 剥掉一个 `ci`，scope 落不进捕获组，输出成 `-  · (release): x`。
              lines=$(grep -E "^(${pattern})(\(.+\))?!?:" /tmp/subjects.txt || true)
              [ -z "$lines" ] && return 0
              echo "**${title}**"
              echo
              # 去掉类型前缀，只留人话；scope 留着，它指明改的是哪一块。
              # \1=类型 \2=(scope) \3=scope。没有 scope 时 \3 为空，会留下
              # `-  · 正文`（两个空格），第二条 sed 就是收这个尾的。
              echo "$lines" | sed -E "s/^(${pattern})(\((.+)\))?!?: */- \3 · /" \
                            | sed -E 's/^- *· /- /'
              echo
            }
            emit 'feat'  '新功能'
            emit 'fix'   '修复'
            emit 'perf'  '性能'
            emit 'refactor' '重构'
            emit 'docs'  '文档'
            emit 'chore|build|ci|test|style' '其它'
            # 不符合规范的提交也要出现，否则会被静默吞掉。
            OTHER=$(grep -vE '^(feat|fix|perf|refactor|docs|chore|build|ci|test|style)(\(.+\))?!?:' /tmp/subjects.txt || true)
            if [ -n "$OTHER" ]; then
              echo "**未分类**"
              echo
              echo "$OTHER" | sed 's/^/- /'
              echo
            fi

            # 内核那一段接在壳体改动之后：先说我们改了什么，再说换进来的内核带来
            # 了什么。内核没换时这个文件是空的，`cat` 出来什么都不加。
            cat /tmp/kernel-notes.md

            echo "---"
            echo
            echo "自动构建：\`main\` 分支每次合入都会出一个 beta 包。"
            echo
            echo "- 对应提交：${GITHUB_SHA}"
            echo "- 打进本版的 ccLoad 内核：\`${KERNEL}\`"
            echo
            echo "macOS 包是 universal（arm64 + x86_64）。壳体与内核架构必须一致，"
            echo "否则 Apple Silicon 上 Rosetta 翻译的 WebKit 会 SIGBUS 白屏。"
          } > /tmp/notes.md
          echo "--- 生成的 notes ---"
          cat /tmp/notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # prerelease：GitHub 不会把「latest」指到它，Release 列表里也标 beta，
          # 想要尝鲜的人自己点进去下。
          tag_name: ${{ needs.bump.outputs.tag }}
          name: Beta ${{ needs.bump.outputs.tag }}
          prerelease: true
          draft: false
          body_path: /tmp/notes.md
          files: release-assets/*
